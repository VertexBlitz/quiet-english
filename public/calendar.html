<!doctype html>
<html lang="ru" data-title-ru="Календарь — Quiet English" data-title-en="Calendar — Quiet English">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Календарь — Quiet English</title>
  <link rel="stylesheet" href="/styles.css?v=20261109-phase1-1">
  <script defer src="/i18n.js"></script>
  <script defer src="/session.js"></script>
  <script defer src="/calendar.js?v=20261107-studio-1"></script>
</head>
<body>
  <header class="topbar wrap">
    <a class="wordmark" href="/">QUIET ENGLISH<span> / PERSONAL LEARNING</span></a>
    <nav aria-label="Main navigation"></nav>
    <div class="language-switch">
      <button type="button" data-set-lang="ru">RU</button>
      <button type="button" data-set-lang="en">EN</button>
      <a class="account-link" href="/login.html">Войти</a>
    </div>
  </header>

  <main class="wrap" id="main-content" data-calendar-page>
    <section class="panel page-head">
      <p class="eyebrow">STUDY CALENDAR</p>
      <h1 data-ru="Твой ритм обучения." data-en="Your learning rhythm.">Твой ритм обучения.</h1>
      <p class="lead" data-ru="Планируй практику, повторение и письменные работы. Напоминания браузера показываются, пока страница открыта." data-en="Schedule practice, review and writing sessions. Browser reminders appear while this page is open.">Планируй практику, повторение и письменные работы. Напоминания браузера показываются, пока страница открыта.</p>
    </section>

    <section class="panel">
      <div class="section-heading">
        <div><p class="eyebrow">ADD TO SCHEDULE</p><h2 data-ru="Запланировать занятие." data-en="Schedule a session.">Запланировать занятие.</h2></div>
        <button class="button secondary" type="button" data-calendar-notifications data-ru="Включить напоминания" data-en="Enable reminders">Включить напоминания</button>
      </div>
      <form data-calendar-form class="calendar-form">
        <label><span data-ru="Название" data-en="Title">Название</span><input name="title" maxlength="120" required data-placeholder-ru="Например, повторить времена" data-placeholder-en="For example, review verb tenses" placeholder="Например, повторить времена"></label>
        <label><span data-ru="Дата и время" data-en="Date and time">Дата и время</span><input type="datetime-local" name="starts_at" required></label>
        <label><span data-ru="Длительность" data-en="Duration">Длительность</span>
          <select name="duration_minutes">
            <option value="10" data-ru="10 минут" data-en="10 minutes">10 минут</option>
            <option value="15" data-ru="15 минут" data-en="15 minutes">15 минут</option>
            <option value="20" selected data-ru="20 минут" data-en="20 minutes">20 минут</option>
            <option value="30" data-ru="30 минут" data-en="30 minutes">30 минут</option>
            <option value="45" data-ru="45 минут" data-en="45 minutes">45 минут</option>
            <option value="60" data-ru="60 минут" data-en="60 minutes">60 минут</option>
          </select>
        </label>
        <label><span data-ru="Тип занятия" data-en="Session type">Тип занятия</span>
          <select name="event_type">
            <option value="study" data-ru="Общая практика" data-en="General practice">Общая практика</option>
            <option value="review" data-ru="Повторение слов" data-en="Vocabulary review">Повторение слов</option>
            <option value="writing">Writing Lab</option>
            <option value="listening" data-ru="Аудирование" data-en="Listening">Аудирование</option>
            <option value="speaking" data-ru="Говорение" data-en="Speaking">Говорение</option>
            <option value="other" data-ru="Другое" data-en="Other">Другое</option>
          </select>
        </label>
        <button class="button" type="submit" data-ru="Добавить в календарь" data-en="Add to calendar">Добавить в календарь</button>
      </form>
      <p class="form-status" data-calendar-status role="status" aria-live="polite"></p>
    </section>

    <section class="panel">
      <div class="section-heading">
        <div><p class="eyebrow">UPCOMING SESSIONS</p><h2 data-calendar-month>Расписание.</h2></div>
        <div class="calendar-nav">
          <button type="button" data-calendar-prev aria-label="Previous month">←</button>
          <button type="button" data-calendar-today data-ru="Сегодня" data-en="Today">Сегодня</button>
          <button type="button" data-calendar-next aria-label="Next month">→</button>
        </div>
      </div>
      <div class="calendar-events" data-calendar-events></div>
    </section>
  </main>
</body>
</html>
