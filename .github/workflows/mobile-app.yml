name: Quiet English mobile app

on:
  push:
    branches:
      - feat/pronunciation-and-listening-library
    tags:
      - "quiet-english-preview-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-pwa:
    name: Validate web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test

  build-debug-apk:
    name: Build Android debug APK
    needs: validate-pwa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-english-preview-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  build-signed-release:
    name: Build signed APK and Play Store AAB
    if: startsWith(github.ref, 'refs/tags/quiet-english-preview-v')
    needs: validate-pwa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Check signing setup and decode keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android release signing secrets are not configured. Debug APK is still available from the previous job."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/quiet-english-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quiet-english-signing/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/quiet-english-signing/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build signed APK and AAB
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#quiet-english-preview-v}"
          gradle --no-daemon \
            -PappVersionCode="${GITHUB_RUN_NUMBER}" \
            -PappVersionName="${RELEASE_VERSION}" \
            :app:assembleRelease :app:bundleRelease
      - name: Generate Digital Asset Links statement
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_PLAY_APP_SIGNING_SHA256: ${{ secrets.ANDROID_PLAY_APP_SIGNING_SHA256 }}
        run: |
          UPLOAD_FINGERPRINT="$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d '\r')"
          if [ -z "$UPLOAD_FINGERPRINT" ]; then
            echo "Could not read the SHA-256 signing certificate fingerprint."
            exit 1
          fi
          FINGERPRINTS="\"$UPLOAD_FINGERPRINT\""
          if [ -n "$ANDROID_PLAY_APP_SIGNING_SHA256" ]; then
            FINGERPRINTS="$FINGERPRINTS, \"$ANDROID_PLAY_APP_SIGNING_SHA256\""
          fi
          cat > "$RUNNER_TEMP/assetlinks.json" <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.vertexblitz.quietenglish.preview",
                "sha256_cert_fingerprints": [$FINGERPRINTS]
              }
            }
          ]
          EOF
      - name: Upload signed release files
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quiet-english-preview-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            ${{ runner.temp }}/assetlinks.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        if: steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            ${{ runner.temp }}/assetlinks.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
