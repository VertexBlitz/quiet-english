</header><main class="wrap"><section class="panel page-head"><p class="eyebrow">01 — YOUR STARTING POINT</p><h1 data-ru="Настроим твой план." data-en="Let's build your plan.">Настроим твой план.</h1><p class="lead" data-ru="Ответь на несколько вопросов. Мы подберём короткие задания под твои цели и время." data-en="Answer a few questions. We'll tailor short activities to your goals and available time.">Ответь на несколько вопросов. Мы подберём короткие задания под твои цели и время.</p></section><section class="panel"><form data-onboarding>
<div class="form-grid">
<label data-ru="Главная цель" data-en="Main goal">Главная цель<select name="goal"><option value="general">General English</option><option value="work">Work</option><option value="travel">Travel</option><option value="communication">Everyday communication</option><option value="relocation">Moving abroad</option><option value="study">Study</option><option value="exam">Exam preparation (general)</option></select></label>
<label data-ru="Как оцениваешь свой уровень?" data-en="How would you rate your level?">Как оцениваешь свой уровень?<select name="self_assessed_level"><option value="">Не уверен(а)</option><option>Pre-A1</option><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option></select></label>
<label data-ru="Время в день" data-en="Time per day">Время в день<select name="minutes_per_day"><option value="5">5 минут</option><option value="10" selected>10 минут</option><option value="15">15 минут</option><option value="30">30 минут</option></select></label>
<label data-ru="Длительность плана" data-en="Plan duration">Длительность плана<select name="duration_weeks"><option value="4" selected>4 недели</option><option value="8">8 недель</option><option value="12">12 недель</option></select></label>
<label data-ru="Язык интерфейса" data-en="Interface language">Язык интерфейса<select name="preferred_language"><option value="ru">Русский</option><option value="en">English</option></select></label>
</div>
<div class="field-block"><h3 data-ru="Какие темы тебе интересны?" data-en="Which topics interest you?">Какие темы тебе интересны?</h3><div class="check-grid">
<label class="check-row"><input type="checkbox" name="interests" value="technology"><span>Technology</span></label>
<label class="check-row"><input type="checkbox" name="interests" value="travel"><span>Travel</span></label>
<label class="check-row"><input type="checkbox" name="interests" value="culture"><span>Culture</span></label>
<label class="check-row"><input type="checkbox" name="interests" value="sports"><span>Sports</span></label>
<label class="check-row"><input type="checkbox" name="interests" value="science"><span>Science</span></label>
<label class="check-row"><input type="checkbox" name="interests" value="books"><span>Books & films</span></label>
</div></div>
<p class="form-status" data-learning-status aria-live="polite"></p><button class="button" type="submit" data-ru="Сохранить и пройти тест" data-en="Save and take placement test">Сохранить и пройти тест ↗</button>
</form></section></main></body></html>
