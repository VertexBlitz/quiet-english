<!doctype html>
<html lang="ru" data-title-ru="Офлайн-библиотека — Quiet English" data-title-en="Offline library — Quiet English">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Офлайн-библиотека — Quiet English</title>
  <link rel="stylesheet" href="/styles.css?v=20261109-phase1-1">
  <link rel="manifest" href="/manifest.webmanifest?v=20261109-app-1">
  <meta name="theme-color" content="#FAFAFA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quiet English">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script defer src="/i18n.js"></script>
  <script defer src="/session.js"></script>
  <script defer src="/offline-client.js"></script>
  <script defer src="/offline.js"></script>
</head>
<body>
  <header class="topbar wrap">
    <a class="wordmark" href="/">QUIET ENGLISH<span> / OFFLINE LIBRARY</span></a>
    <nav aria-label="Main navigation"></nav>
    <div class="language-switch">
      <button type="button" data-set-lang="ru">RU</button>
      <button type="button" data-set-lang="en">EN</button>
      <a class="account-link" href="/login.html">Войти</a>
    </div>
  </header>

  <main class="wrap" id="main-content">
    <section class="panel page-head">
      <p class="eyebrow">OFFLINE MODE</p>
      <h1 data-ru="Материалы на этом устройстве." data-en="Saved on this device.">Материалы на этом устройстве.</h1>
      <p class="lead" data-ru="Здесь доступны тексты и материалы, которые ты заранее сохранил(а). Для синхронизации аккаунта и функций ИИ нужен интернет." data-en="Find the texts and materials you saved on this device. Account sync and AI features require an internet connection.">Здесь доступны тексты и материалы, которые ты заранее сохранил(а). Для синхронизации аккаунта и функций ИИ нужен интернет.</p>
    </section>
    <section class="panel">
      <div data-offline-list aria-live="polite"><p class="fine-print" data-ru="Загружаем локальные материалы…" data-en="Loading saved materials…">Загружаем локальные материалы…</p></div>
    </section>
  </main>
</body>
</html>
