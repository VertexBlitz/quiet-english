services:
  - type: web
    name: quiet-english-tutor
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        value: https://quiet-english-tutor.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://app.quietenglishcom.aclclouds.online
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: MINOR_SIGNUP_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: quiet-english-db-dev
          property: connectionString
