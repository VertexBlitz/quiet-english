name: Quiet English 2.0 checks
on:
  push:
    branches: [quiet-english-2-mvp, main, feat/pronunciation-and-listening-library, feat/adult-signup-turnstile-audit, feat/phase-1-learning-localization, fix/mobile-pwa-refresh]
  pull_request:
    branches: [quiet-english-2-mvp, main, feat/pronunciation-and-listening-library, feat/phase-1-learning-localization, fix/mobile-pwa-refresh]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
